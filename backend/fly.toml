# Fly.io config for the THRIVE FastAPI backend.
# Deploy from the repo root with `fly deploy --config backend/fly.toml`.
# Runtime secrets (DATABASE_URL, WHATSAPP_*, THRIVE_SECRET) are set with
# `fly secrets set` — never committed here.
app = "thrive-2026-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# The Dockerfile runs uvicorn on 8000; internal_port must match it or the
# health check hits a closed port and the deploy times out.
[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
