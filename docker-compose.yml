version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: thrive
      POSTGRES_PASSWORD: thrive
      POSTGRES_DB: thrive
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./curriculum:/app/curriculum
    environment:
      DATABASE_URL: postgresql://thrive:thrive@postgres:5432/thrive
      REDIS_URL: redis://redis:6379/0
      THRIVE_SECRET: ${THRIVE_SECRET:-change-me-in-production}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-thrive-verify}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_DISPLAY_NUMBER: ${WHATSAPP_DISPLAY_NUMBER:-}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  worker:
    build: ./worker
    command: celery -A worker.tasks worker --loglevel=info
    volumes:
      - ./worker:/app
    environment:
      DATABASE_URL: postgresql://thrive:thrive@postgres:5432/thrive
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

volumes:
  db-data:
